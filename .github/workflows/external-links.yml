name: External links

on:
  # Weekly rather than per-PR: third-party sites rate-limit and flake,
  # so this must never block a merge.
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check external links
        run: npm run test:links
