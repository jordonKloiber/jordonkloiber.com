name: Test

on:
  # PRs are checked directly. Pushes to main are checked via deploy.yml
  # calling this workflow as a job (workflow_call below) — no separate
  # push trigger here, or every push to main would run the suite twice.
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real Chromium, not a headless approximation — this repo is public
      # portfolio evidence, and the a11y suite (9b) should reflect genuine
      # browser-driven WCAG scans. ~150MB / ~30s, accepted deliberately.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
